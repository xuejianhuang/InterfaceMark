[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interfacemark"
version = "0.1.0"
description = "Terminal watermark injection and keyed verification"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "numpy>=1.26", "scipy>=1.11", "Pillow>=10", "PyYAML>=6", "diffusers>=0.35", "transformers>=4.44", "accelerate>=1", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
interfacemark-prepare = "interfacemark.prepare:main"
interfacemark-generate = "interfacemark.generate:main"
interfacemark-evaluate = "interfacemark.evaluate:main"
interfacemark-learned = "interfacemark.learned:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
